ght="700">M</text><rect x="809.3333333333333" y="390" width="49.55555555555556" height="44" rx="3" fill="#8451b2" stroke="none"/><text x="829.1111111111111" y="419" font-size="18" fill="white" font-weight="700">2</text><rect x="860.8888888888888" y="390" width="49.55555555555556" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="880.6666666666666" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="912.4444444444443" y="390" width="49.55555555555556" height="44" rx="3" fill="#14735b" stroke="none"/><text x="932.2222222222222" y="419" font-size="18" fill="white" font-weight="700">3</text><text x="36" y="458" font-size="15" fill="#59687a" font-weight="400">earlier</text><path d="M102 453 L882 453" fill="none" stroke="#59687a" stroke-width="2"/><path d="M874 448 l8 5 l-8 5" fill="none" stroke="#59687a" stroke-width="2"/><text x="898" y="458" font-size="15" fill="#59687a" font-weight="400">later</text><text x="36" y="511" font-size="19" fill="#203047" font-weight="600">Equal turns: half the time for melody, half for the chord.</text></g></svg>