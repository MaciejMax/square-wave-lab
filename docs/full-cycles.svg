<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Finish the wave before changing notes</title><desc id="desc">Finish the wave before changing notes. Blue is the melody; orange, purple and green are the three chord notes.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1000" height="540" rx="16" fill="#fbfaf6" stroke="none"/><text x="36" y="35" font-size="14" fill="#59687a" font-weight="700">ONE GENERATOR / TAKING TURNS</text><text x="36" y="76" font-size="30" fill="#203047" font-weight="700">Finish the wave before changing notes</text><text x="36" y="109" font-size="19" fill="#203047" font-weight="400">Wait for a complete high + low pair, then choose the next note.</text><rect x="36" y="137" width="146" height="32" rx="7" fill="#2363d1" stroke="none"/><text x="49" y="160" font-size="18" fill="white" font-weight="600">M  Melody</text><rect x="36" y="177" width="146" height="32" rx="7" fill="#b65a13" stroke="none"/><text x="49" y="200" font-size="18" fill="white" font-weight="600">1   C</text><rect x="36" y="217" width="146" height="32" rx="7" fill="#8451b2" stroke="none"/><text x="49" y="240" font-size="18" fill="white" font-weight="600">2   E</text><rect x="36" y="257" width="146" height="32" rx="7" fill="#14735b" stroke="none"/><text x="49" y="280" font-size="18" fill="white" font-weight="600">3   G</text><text x="36" y="316" font-size="16" fill="#59687a" font-weight="400">1 + 2 + 3 = chord</text><path d="M185 153 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><path d="M185 193 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><path d="M185 233 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><path d="M185 273 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><rect x="276" y="145" width="280" height="146" rx="14" fill="#eef2f7" stroke="#cbd4df"/><text x="297" y="177" font-size="16" fill="#59687a" font-weight="700">ONE GENERATOR</text><polyline points="308,223 308.0,199 329.0,199 329.0,223 350.0,223 350.0,199 371.0,199 371.0,223 392.0,223 392.0,199 413.0,199 413.0,223 434.0,223 434.0,199 455.0,199 455.0,223 476.0,223 476.0,199 497.0,199 497.0,223 518.0,223" fill="none" stroke="#203047" stroke-width="3"/><text x="297" y="270" font-size="18" fill="#203047" font-weight="400">Whole waves only</text><path d="M571 214 L651 214" fill="none" stroke="#59687a" stroke-width="2"/><path d="M643 209 l8 5 l-8 5" fill="none" stroke="#59687a" stroke-width="2"/><path d="M669 204 h18 l25 -20 v62 l-25 -20 h-18 Z" fill="#203047"/><path d="M723 194 Q747 216 723 238" fill="none" stroke="#203047" stroke-width="4"/><text x="782" y="199" font-size="23" fill="#203047" font-weight="700">One note</text><text x="782" y="229" font-size="23" fill="#203047" font-weight="400">at a time</text><text x="782" y="260" font-size="16" fill="#59687a" font-weight="400">The others wait.</text><text x="36" y="358" font-size="18" fill="#2363d1" font-weight="700">Complete waves</text><text x="561" y="358" font-size="18" fill="#b65a13" font-weight="700">Next note: a different length</text><polyline points="40,412 40.0,388 110.0,388 110.0,412 180.0,412 180.0,388 250.0,388 250.0,412 320.0,412 320.0,388 390.0,388 390.0,412 460.0,412" fill="none" stroke="#2363d1" stroke-width="3"/><polyline points="460,412 460.0,388 580.0,388 580.0,412 700.0,412 700.0,388 820.0,388 820.0,412 940.0,412" fill="none" stroke="#b65a13" stroke-width="3"/><path d="M460 363 L460 441" fill="none" stroke="#203047" stroke-width="2" stroke-dasharray="5 5"/><text x="440" y="467" font-size="16" fill="#203047" font-weight="400">change</text><text x="36" y="511" font-size="19" fill="#203047" font-weight="600">Switch here: at the start of the next complete wave.</text></g></svg>