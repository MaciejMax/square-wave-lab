<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Meet the four musical parts</title><desc id="desc">Meet the four musical parts. Blue is the melody; orange, purple and green are the three chord notes.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1000" height="480" rx="16" fill="#fbfaf6" stroke="none"/><text x="36" y="35" font-size="14" fill="#59687a" font-weight="700">MEET THE PLAYERS</text><text x="36" y="76" font-size="30" fill="#203047" font-weight="700">One tune. Three notes underneath.</text><text x="36" y="109" font-size="19" fill="#203047" font-weight="400">We use the same melody and chords in every experiment.</text><rect x="36" y="139" width="435" height="170" rx="10" fill="#eaf0fd" stroke="none"/><text x="58" y="174" font-size="16" fill="#2363d1" font-weight="700">THE MELODY</text><text x="58" y="204" font-size="20" fill="#203047" font-weight="400">The part you can hum</text><text x="490" y="235" font-size="32" fill="#203047" font-weight="400">+</text><rect x="530" y="139" width="434" height="170" rx="10" fill="#f0ece5" stroke="none"/><text x="552" y="174" font-size="16" fill="#203047" font-weight="700">THE CHORD</text><text x="552" y="204" font-size="20" fill="#203047" font-weight="400">Three notes: C + E + G</text><rect x="58" y="225" width="78" height="60" rx="10" fill="#2363d1" stroke="none"/><text x="84" y="266" font-size="30" fill="white" font-weight="700">E</text><rect x="154" y="225" width="78" height="60" rx="10" fill="#2363d1" stroke="none"/><text x="180" y="266" font-size="30" fill="white" font-weight="700">E</text><rect x="250" y="225" width="78" height="60" rx="10" fill="#2363d1" stroke="none"/><text x="276" y="266" font-size="30" fill="white" font-weight="700">F</text><rect x="346" y="225" width="78" height="60" rx="10" fill="#2363d1" stroke="none"/><text x="372" y="266" font-size="30" fill="white" font-weight="700">G</text><rect x="552" y="225" width="110" height="60" rx="10" fill="#b65a13" stroke="none"/><text x="595" y="266" font-size="30" fill="white" font-weight="700">C</text><rect x="682" y="225" width="110" height="60" rx="10" fill="#8451b2" stroke="none"/><text x="725" y="266" font-size="30" fill="white" font-weight="700">E</text><rect x="812" y="225" width="110" height="60" rx="10" fill="#14735b" stroke="none"/><text x="855" y="266" font-size="30" fill="white" font-weight="700">G</text><text x="36" y="355" font-size="25" fill="#203047" font-weight="700">Four parts, but how many generators?</text><text x="36" y="392" font-size="20" fill="#203047" font-weight="400">With one generator, the players take turns. With four, everyone can play together.</text><text x="36" y="441" font-size="18" fill="#59687a" font-weight="400">The tune starts on E. The chord also contains E; these are still two separate parts.</text></g></svg>