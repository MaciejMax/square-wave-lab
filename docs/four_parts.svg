<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title description"><title id="title">Meet the four parts</title><desc id="description">Blue melody E4 plus three chord notes: orange C4, purple E4, green G4.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1000" height="300" rx="0" fill="#f1f5fa" opacity="1"/><text x="32" y="42" font-size="28" fill="#182a43" font-weight="700">One tune + three chord notes = four parts</text><text x="32" y="76" font-size="18" fill="#182a43" font-weight="400">At the beginning, the tune plays E while the chord is C + E + G.</text><text x="42" y="116" font-size="16" fill="#182a43" font-weight="700">THE MELODY</text><text x="350" y="116" font-size="16" fill="#182a43" font-weight="700">THE CHORD: THREE NOTES TOGETHER</text><rect x="40" y="132" width="250" height="100" rx="5" fill="#2563eb" opacity="1"/><text x="58" y="174" font-size="32" fill="white" font-weight="700">E4</text><text x="58" y="210" font-size="17" fill="white" font-weight="400">The tune</text><rect x="350" y="132" width="175" height="100" rx="5" fill="#c46510" opacity="1"/><text x="368" y="174" font-size="32" fill="white" font-weight="700">C4</text><text x="368" y="210" font-size="17" fill="white" font-weight="400">Chord note 1</text><rect x="555" y="132" width="175" height="100" rx="5" fill="#9154c8" opacity="1"/><text x="573" y="174" font-size="32" fill="white" font-weight="700">E4</text><text x="573" y="210" font-size="17" fill="white" font-weight="400">Chord note 2</text><rect x="760" y="132" width="175" height="100" rx="5" fill="#148260" opacity="1"/><text x="778" y="174" font-size="32" fill="white" font-weight="700">G4</text><text x="778" y="210" font-size="17" fill="white" font-weight="400">Chord note 3</text><text x="310" y="190" font-size="30" fill="#182a43" font-weight="400">+</text><text x="40" y="270" font-size="18" fill="#182a43" font-weight="400">E appears twice here: once in the tune, and once as part of the chord.</text></g></svg>