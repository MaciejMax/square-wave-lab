<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">summed: four independent square-wave generators</title><desc id="desc">summed: four independent square-wave generators. Blue is the melody; orange, purple and green are the three chord notes.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1000" height="540" rx="16" fill="#fbfaf6" stroke="none"/><text x="36" y="35" font-size="14" fill="#59687a" font-weight="700">FOUR VOICES / PLAYING TOGETHER</text><text x="36" y="76" font-size="30" fill="#203047" font-weight="700">Everyone gets a generator</text><text x="36" y="109" font-size="19" fill="#203047" font-weight="400">Add the melody and three chord notes. Nobody has to wait.</text><rect x="36" y="137" width="146" height="32" rx="7" fill="#2363d1" stroke="none"/><text x="49" y="160" font-size="18" fill="white" font-weight="600">M  Melody</text><rect x="36" y="177" width="146" height="32" rx="7" fill="#b65a13" stroke="none"/><text x="49" y="200" font-size="18" fill="white" font-weight="600">1   C</text><rect x="36" y="217" width="146" height="32" rx="7" fill="#8451b2" stroke="none"/><text x="49" y="240" font-size="18" fill="white" font-weight="600">2   E</text><rect x="36" y="257" width="146" height="32" rx="7" fill="#14735b" stroke="none"/><text x="49" y="280" font-size="18" fill="white" font-weight="600">3   G</text><text x="36" y="316" font-size="16" fill="#59687a" font-weight="400">1 + 2 + 3 = chord</text><path d="M190 153 L234 153" fill="none" stroke="#59687a" stroke-width="2"/><path d="M226 148 l8 5 l-8 5" fill="none" stroke="#59687a" stroke-width="2"/><rect x="246" y="137" width="208" height="32" rx="6" fill="#edf1f5" stroke="none"/><polyline points="262,165 262.0,141 279.0,141 279.0,165 296.0,165 296.0,141 313.0,141 313.0,165 330.0,165 330.0,141 347.0,141 347.0,165 364.0,165 364.0,141 381.0,141 381.0,165 398.0,165 398.0,141 415.0,141 415.0,16