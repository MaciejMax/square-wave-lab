<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Give each note time to settle</title><desc id="desc">Give each note time to settle. Blue is the melody; orange, purple and green are the three chord notes.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1000" height="540" rx="16" fill="#fbfaf6" stroke="none"/><text x="36" y="35" font-size="14" fill="#59687a" font-weight="700">ONE GENERATOR / TAKING TURNS</text><text x="36" y="76" font-size="30" fill="#203047" font-weight="700">Give each note time to settle</text><text x="36" y="109" font-size="19" fill="#203047" font-weight="400">Draw a part, keep it for 4-12 complete waves, then draw again.</text><rect x="36" y="137" width="146" height="32" rx="7" fill="#2363d1" stroke="none"/><text x="49" y="160" font-size="18" fill="white" font-weight="600">M  Melody</text><rect x="36" y="177" width="146" height="32" rx="7" fill="#b65a13" stroke="none"/><text x="49" y="200" font-size="18" fill="white" font-weight="600">1   C</text><rect x="36" y="217" width="146" height="32" rx="7" fill="#8451b2" stroke="none"/><text x="49" y="240" font-size="18" fill="white" font-weight="600">2   E</text><rect x="36" y="257" width="146" height="32" rx="7" fill="#14735b" stroke="none"/><text x="49" y="280" font-size="18" fill="white" font-weight="600">3   G</text><text x="36" y="316" font-size="16" fill="#59687a" font-weight="400">1 + 2 + 3 = chord</text><path d="M185 153 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><path d="M185 193 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><path d="M185 233 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><path d="M185 273 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><rect x="276" y="145" width="280" height="146" rx="14" fill="#eef2f7" stroke="#cbd4df"/><text x="297" y="177" font-size="16" fill="#59687a" font-weight="700">ONE GENERATOR</text><polyline points="308,223 308.0,199 329.0,199 329.0,223 350.0,223 350.0,199 371.0,199 371.0,223 392.0,223 392.0,199 413.0,199 413.0,223 434.0,223 434.0,199 455.0,199 455.0,223 476.0,223 476.0,199 497.0,199 497.0,223 518.0,223" fill="none" stroke="#203047" stroke-width="3"/><text x="297" y="270" font-size="18" fill="#203047" font-weight="400">4-12 waves per draw</text><path d="M571 214 L651 214" fill="none" stroke="#59687a" stroke-width="2"/><path d="M643 209 l8 5 l-8 5" fill="none" stroke="#59687a" stroke-width="2"/><path d="M669 204 h18 l25 -20 v62 l-25 -20 h-18 Z" fill="#203047"/><path d="M723 194 Q747 216 723 238" fill="none" stroke="#203047" stroke-width="4"/><text x="782" y="199" font-size="23" fill="#203047" font-weight="700">One note</text><text x="782" y="229" font-size="23" fill="#203047" font-weight="400">at a time</text><text x="782" y="260" font-size="16" fill="#59687a" font-weight="400">The others wait.</text><text x="36" y="363" font-size="18" fill="#59687a" font-weight="400">Each small tick is a wave; each colored group is one turn.</text><rect x="36.0" y="390" width="152.66666666666666" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="107.33333333333333" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="190.66666666666666" y="390" width="66.74074074074075" height="44" rx="3" fill="#b65a13" stroke="none"/><text x="219.03703703703704" y="419" font-size="18" fill="white" font-weight="700">1</text><rect x="259.4074074074074" y="390" width="135.4814814814815" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="322.14814814814815" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="396.8888888888889" y="390" width="83.92592592592592" height="44" rx="3" fill="#14735b" stroke="none"/><text x="433.85185185185185" y="419" font-size="18" fill="white" font-weight="700">3</text><rect x="482.81481481481484" y="390" width="204.22222222222223" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="579.925925925926" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="689.0370370370371" y="390" width="101.11111111111111" height="44" rx="3" fill="#8451b2" stroke="none"/><text x="734.5925925925926" y="419" font-size="18" fill="white" font-weight="700">2</text><rect x="792.1481481481482" y="390" width="169.85185185185185" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="872.0740740740741" y="419" font-size="18" fill="white" font-weight="700">M</text><text x="36" y="458" font-size="15" fill="#59687a" font-weight="400">earlier</text><path d="M102 453 L882 453" fill="none" stroke="#59687a" stroke-width="2"/><path d="M874 448 l8 5 l-8 5" fill="none" stroke="#59687a" stroke-width="2"/><text x="898" y="458" font-size="15" fill="#59687a" font-weight="400">later</text><path d="M53.18518518518519 425 L53.18518518518519 433" fill="none" stroke="#fbfaf6" stroke-width="2"/><path d="M70.37037037037038 425 L70.37037037037038 433" fill="none" stroke="#fbfaf6" stroke-width="2"/><path d="M87.55555555555556 425 L87.55555555555556 433" fill="none" stroke="#fbfaf6" stroke-width="2"/><path d="M104.74074074074075 425 L104.74074074074075 433" fill="none" stroke="#fbfaf6" stroke-width="2"/><path d="M121.92592592592594 425 L121.92592592592594 433" fill="none" stroke="#fbfaf6" stroke-width="2"/><path d="M139.11111111111111 425 L139.11111111111111 433" fill="none" stroke="#fbfaf6" stroke-width="2"/><path d="M156.2962962962963 425 L156.2962962962963 433" fill="none" stroke="#fbfaf6" stroke-width="2"/><path d="M173.4814814814815 425 L173.4814814814815 433" fill="none" stroke="#fbfaf6" stroke-width="2"/><path d="M190.66666666666669 425 L190.66666666666669 433" fill="none" stroke="#fbfaf6" stroke-width="2"/><path d="M207.85185185185188 425 L207.85185185185188 433" fill="none" stroke="#fbfaf6" stroke-width="2"/><path d="M225.03703703703707 425 L225.03703703703707 433" fill="none" stroke="#fbfaf6" stroke-width="2"/><path d="M242.22222222222223 425 L242.22222222222223 433" fill="n