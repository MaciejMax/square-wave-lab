<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Space: softer instruments with stereo echoes</title><desc id="desc">Space: softer instruments with stereo echoes. Blue is the melody; orange, purple and green are the three chord notes.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1000" height="540" rx="16" fill="#fbfaf6" stroke="none"/><text x="36" y="35" font-size="14" fill="#59687a" font-weight="700">START HERE / SPACE</text><text x="36" y="76" font-size="30" fill="#203047" font-weight="700">A little room around the music</text><text x="36" y="109" font-size="19" fill="#203047" font-weight="400">Melody + soft chords + low bass, with echoes on the left and right.</text><rect x="36" y="137" width="146" height="32" rx="7" fill="#2363d1" stroke="none"/><text x="49" y="160" font-size="18" fill="white" font-weight="600">M  Melody</text><rect x="36" y="177" width="146" height="32" rx="7" fill="#b65a13" stroke="none"/><text x="49" y="200" font-size="18" fill="white" font-weight="600">1   C</text><rect x="36" y="217" width="146" height="32" rx="7" fill="#8451b2" stroke="none"/><text x="49" y="240" font-size="18" fill="white" font-weight="600">2   E</text><rect x="36" y="257" width="146" height="32" rx="7" fill="#14735b" stroke="none"/><text x="49" y="280" font-size="18" fill="white" font-weight="600">3   G</text><text x="36" y="316" font-size="16" fill="#59687a" font-weight="400">1 + 2 + 3 = chord</text><path d="M189 153 L287 211" fill="none" stroke="#2363d1" stroke-width="2"/><path d="M189 193 L287 211" fill="none" stroke="#b65a13" stroke-width="2"/><path d="M189 233 L287 211" fill="none" stroke="#8451b2" stroke-width="2"/><path d="M189 273 L287 211" fill="none" stroke="#14735b" stroke-width="2"/><rect x="287" y="145" width="270" height="145" rx="10" fill="#edf1f5" stroke="none"/><text x="309" y="181" font-size="23" fill="#203047" font-weight="700">Softer instruments</text><text x="309" y="218" font-size="20" fill="#203047" font-weight="400">A retro lead</text><text x="309" y="251" font-size="20" fill="#203047" font-weight="400">and a gentle backing</text><path d="M572 212 L643 212" fill="none" stroke="#59687a" stroke-width="2"/><path d="M635 207 l8 5 l-8 5" fill="none" stroke="#59687a" stroke-width="2"/><path d="M674 190 h18 l25 -20 v62 l-25 -20 h-18 Z" fill="#203047"/><path d="M728 180 Q752 202 728 224" fill="none" stroke="#203047" stroke-width="4"/><text x="782" y="201" font-size="23" fill="#203047" font-weight="700">Left + right</text><text x="782" y="233" font-size="20" fill="#203047" font-weight="400">Small echoes</text><text x="782" y="263" font-size="18" fill="#59687a" font-weight="400">A wider sound</text><text x="36" y="362" font-size="19" fill="#203047" font-weight="600">A note...</text><text x="409" y="362" font-size="19" fill="#203047" font-weight="400">...comes back a little quieter.</text><rect x="36" y="386" width="218" height="45" rx="10" fill="#2363d1" stroke="none"/><rect x="293" y="386" width="170" height="45" rx="10" fill="#789ee0" stroke="none"/><rect x="502" y="386" width="132" height="45" rx="10" fill="#a5bde7" stroke="none"/><rect x="673" y="386" width="96" height="45" rx="10" fill="#ccd9ee" stroke="none"/><rect x="808" y="386" width="62" height="45" rx="10" fill="#e0e8f4" stroke="none"/><text x="36" y="493" font-size="19" fill="#203047" font-weight="400">More than square waves: this arrangement adds soft tones, bass and stereo effects.</text></g></svg>