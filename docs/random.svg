<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Who goes next? Draw a name.</title><desc id="desc">Who goes next? Draw a name.. Blue is the melody; orange, purple and green are the three chord notes.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1000" height="540" rx="16" fill="#fbfaf6" stroke="none"/><text x="36" y="35" font-size="14" fill="#59687a" font-weight="700">ONE GENERATOR / TAKING TURNS</text><text x="36" y="76" font-size="30" fill="#203047" font-weight="700">Who goes next? Draw a name.</text><text x="36" y="109" font-size="19" fill="#203047" font-weight="400">Choose a part after every complete wave. The tune gets most of the time.</text><rect x="36" y="137" width="146" height="32" rx="7" fill="#2363d1" stroke="none"/><text x="49" y="160" font-size="18" fill="white" font-weight="600">M  Melody</text><rect x="36" y="177" width="146" height="32" rx="7" fill="#b65a13" stroke="none"/><text x="49" y="200" font-size="18" fill="white" font-weight="600">1   C</text><rect x="36" y="217" width="146" height="32" rx="7" fill="#8451b2" stroke="none"/><text x="49" y="240" font-size="18" fill="white" font-weight="600">2   E</text><rect x="36" y="257" width="146" height="32" rx="7" fill="#14735b" stroke="none"/><text x="49" y="280" font-size="18" fill="white" font-weight="600">3   G</text><text x="36" y="316" font-size="16" fill="#59687a" font-weight="400">1 + 2 + 3 = chord</text><path d="M185 153 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><path d="M185 193 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><path d="M185 233 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><path d="M185 273 L276 211" fill="none" stroke="#59687a" stroke-width="2"/><rect x="276" y="145" width="280" height="146" rx="14" fill="#eef2f7" stroke="#cbd4df"/><text x="297" y="177" font-size="16" fill="#59687a" font-weight="700">ONE GENERATOR</text><polyline points="308,223 308.0,199 329.0,199 329.0,223 350.0,223 350.0,199 371.0,199 371.0,223 392.0,223 392.0,199 413.0,199 413.0,223 434.0,223 434.0,199 455.0,199 455.0,223 476.0,223 476.0,199 497.0,199 497.0,223 518.0,223" fill="none" stroke="#203047" stroke-width="3"/><text x="297" y="270" font-size="18" fill="#203047" font-weight="400">One wave per draw</text><path d="M571 214 L651 214" fill="none" stroke="#59687a" stroke-width="2"/><path d="M643 209 l8 5 l-8 5" fill="none" stroke="#59687a" stroke-width="2"/><path d="M669 204 h18 l25 -20 v62 l-25 -20 h-18 Z" fill="#203047"/><path d="M723 194 Q747 216 723 238" fill="none" stroke="#203047" stroke-width="4"/><text x="782" y="199" font-size="23" fill="#203047" font-weight="700">One note</text><text x="782" y="229" font-size="23" fill="#203047" font-weight="400">at a time</text><text x="782" y="260" font-size="16" fill="#59687a" font-weight="400">The others wait.</text><text x="36" y="363" font-size="18" fill="#59687a" font-weight="400">One strip = the one generator&#x27;s playing time</text><rect x="36.0" y="390" width="31.142857142857146" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="46.57142857142857" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="69.14285714285714" y="390" width="31.142857142857146" height="44" rx="3" fill="#8451b2" stroke="none"/><text x="79.71428571428571" y="419" font-size="18" fill="white" font-weight="700">2</text><rect x="102.28571428571428" y="390" width="31.142857142857146" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="112.85714285714285" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="135.42857142857142" y="390" width="31.142857142857146" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="146.0" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="168.57142857142856" y="390" width="31.142857142857146" height="44" rx="3" fill="#b65a13" stroke="none"/><text x="179.14285714285714" y="419" font-size="18" fill="white" font-weight="700">1</text><rect x="201.7142857142857" y="390" width="31.142857142857146" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="212.28571428571428" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="234.85714285714283" y="390" width="31.142857142857146" height="44" rx="3" fill="#14735b" stroke="none"/><text x="245.42857142857142" y="419" font-size="18" fill="white" font-weight="700">3</text><rect x="268.0" y="390" width="31.142857142857146" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="278.57142857142856" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="301.14285714285717" y="390" width="31.142857142857146" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="311.7142857142857" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="334.28571428571433" y="390" width="31.142857142857146" height="44" rx="3" fill="#8451b2" stroke="none"/><text x="344.8571428571429" y="419" font-size="18" fill="white" font-weight="700">2</text><rect x="367.4285714285715" y="390" width="31.142857142857146" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="378.00000000000006" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="400.57142857142867" y="390" width="31.142857142857146" height="44" rx="3" fill="#b65a13" stroke="none"/><text x="411.1428571428572" y="419" font-size="18" fill="white" font-weight="700">1</text><rect x="433.71428571428584" y="390" width="31.142857142857146" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="444.2857142857144" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="466.857142857143" y="390" width="31.142857142857146" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="477.42857142857156" y="419" font-size="18" fill="white" font-weight="700">M</text><rect x="500.00000000000017" y="390" width="31.142857142857146" height="44" rx="3" fill="#2363d1" stroke="none"/><text x="510.571428